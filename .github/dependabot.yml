version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    ignore:
      # changesets/action v2 only supports Changesets CLI v3. Upgrade the
      # action together with @changesets/cli, not on its own.
      - dependency-name: changesets/action
        update-types:
          - version-update:semver-major
