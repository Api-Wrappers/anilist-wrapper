name: Schema Drift

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  codegen:
    name: Refresh generated types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run codegen
        run: bun run codegen

      - name: Open pull request when generated files change
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh generated AniList types"
          title: "chore: refresh generated AniList types"
          body: |
            Automated codegen refresh. AniList's schema or generated operation
            output changed since the last run.

            Review the generated diff, then run `bun run verify` before merging.
          branch: chore/schema-drift
          delete-branch: true
